[project]
name = "voicel2d-mvp"
version = "0.1.0"
description = "Voice-controlled Live2D application with LLM, ASR and TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=2.13.1",
    "ipykernel>=7.1.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "openai>=2.8.1",
    "requests>=2.32.5",
    "ruff>=0.14.6",
    "setuptools>=70.0.0",
    "simpleaudio>=1.0.4",
    "sounddevice>=0.4.6",
    "toml>=0.10.2",       # Personal preference over stdlib tomllib for config reading
    "webrtcvad>=2.0.10",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Local ASR using Faster-Whisper (requires PyTorch)
# Install with: uv sync --extra local-asr
local-asr = ["faster-whisper>=1.0.0", "torch>=2.0.0"]

[tool.uv]
# Configure PyTorch to use CUDA 11.8 index
# This ensures GPU-accelerated PyTorch is installed for local ASR

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
